name: Build STARLOOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Restore project
        run: |
          mkdir game
          cat bundle/chunk_* > starloom_ci.rebuilt.b64
          echo "ce7eec9013e978c443f2016036fb0b92159869766012623634fa7bfccb0fe38c  starloom_ci.rebuilt.b64" | sha256sum -c -
          base64 -d starloom_ci.rebuilt.b64 > starloom_ci.tar.gz
          echo "f8957ef823eea47e20252bdf53f5d7b5c0ce2346b02e7bef54f40a3685bc7ba4  starloom_ci.tar.gz" | sha256sum -c -
          tar -xzf starloom_ci.tar.gz -C game
          cd game
          python3 tools/generate_audio.py
          python3 tools/validate_project.py
          python3 tools/simulate_economy.py

      - name: Godot parse/import smoke test
        working-directory: game
        run: godot --headless --editor --quit --verbose

      - name: Build APK
        working-directory: game
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/STARLOOM.apk

      - name: Build Web
        working-directory: game
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STARLOOM-Android
          path: game/build/android/STARLOOM.apk

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: STARLOOM-Web
          path: game/build/web
