name: Build STARLOOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Restore project
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          mkdir game
          cat bundle/chunk_* > starloom_ci.rebuilt.b64
          echo "ce7eec9013e978c443f2016036fb0b92159869766012623634fa7bfccb0fe38c  starloom_ci.rebuilt.b64" | sha256sum -c -
          base64 -d starloom_ci.rebuilt.b64 > starloom_ci.tar.gz
          echo "f8957ef823eea47e20252bdf53f5d7b5c0ce2346b02e7bef54f40a3685bc7ba4  starloom_ci.tar.gz" | sha256sum -c -
          tar -xzf starloom_ci.tar.gz -C game
          printf '\n[debug]\ngdscript/warnings/inference_on_variant=0\n' >> game/project.godot
          sed -i '1c[gd_resource type="AudioBusLayout" format=3]' game/default_bus_layout.tres
          cat >> game/default_bus_layout.tres <<'BUS'
          bus/1/name = &"Music"
          bus/1/solo = false
          bus/1/mute = false
          bus/1/bypass_fx = false
          bus/1/volume_db = 0.0
          bus/1/send = &"Master"
          bus/2/name = &"SFX"
          bus/2/solo = false
          bus/2/mute = false
          bus/2/bypass_fx = false
          bus/2/volume_db = 0.0
          bus/2/send = &"Master"
          BUS
          cd game
          python3 tools/generate_audio.py
          python3 tools/validate_project.py
          python3 tools/simulate_economy.py

      - name: Godot parse/import smoke test
        working-directory: game
        run: HOME=/root godot --headless --editor --quit --verbose

      - name: Check GDScript entrypoints
        working-directory: game
        run: |
          HOME=/root godot --headless --script scripts/ui/loom_view.gd --check-only
          HOME=/root godot --headless --script scripts/ui/game_ui.gd --check-only
          HOME=/root godot --headless --script scripts/main.gd --check-only

      - name: Build APK
        working-directory: game
        run: |
          mkdir -p build/android
          HOME=/root godot --headless --export-debug "Android" build/android/STARLOOM.apk

      - name: Build Web
        working-directory: game
        run: |
          mkdir -p build/web
          HOME=/root godot --headless --export-release "Web" build/web/index.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STARLOOM-Android
          path: game/build/android/STARLOOM.apk

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: STARLOOM-Web
          path: game/build/web
