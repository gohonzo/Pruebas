name: Deploy RIFTWEAVE

on:
  push:
    branches: [riftweave]
    paths:
      - "riftweave/**"
      - ".github/workflows/riftweave-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-riftweave"
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish RIFTWEAVE to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout RIFTWEAVE branch
        uses: actions/checkout@v4
        with:
          ref: riftweave

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload RIFTWEAVE site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./riftweave

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
